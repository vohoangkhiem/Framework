name: Playwright Tests

on:
  # --- Automated triggers temporarily disabled (see README.md > CI/CD for how to re-enable) ---
  # push:
  #   branches: [main, master, develop]
  # pull_request:
  #   branches: [main, master, develop]
  # # Nightly full run.
  # schedule:
  #   - cron: "0 17 * * *"
  workflow_dispatch:

# Cancel superseded runs of the same branch to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  HUSKY: 0
  TEST_ENV: dev
  LOG_FORMAT: json
  EXCLUDE_TAGS: "@wip|@flaky"

jobs:
  quality:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  api-tests:
    name: API and framework self-tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
      # Share the host IPC namespace: the default container /dev/shm (64 MB) is too small for
      # browser shared-memory rendering buffers and makes WebKit crash with "Page crashed".
      options: --ipc=host
    env:
      # The Playwright container runs as root; GitHub Actions mounts $HOME as /github/home
      # (owned by a different uid), which Firefox/WebKit refuse to launch under.
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npx playwright test --project=api --project=framework
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: api-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: api-test-results
          path: test-results/
          retention-days: 7

  ui-tests:
    name: UI tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
      # Share the host IPC namespace: the default container /dev/shm (64 MB) is too small for
      # browser shared-memory rendering buffers and makes WebKit crash with "Page crashed".
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    env:
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      WORKERS: 2
      # The Playwright container runs as root; GitHub Actions mounts $HOME as /github/home
      # (owned by a different uid), which Firefox/WebKit refuse to launch under.
      HOME: /root
      # The container has no GPU: WebKit's accelerated compositing / DMABUF renderer crashes the
      # web process ("Page crashed") on media-heavy pages. Force the software rendering path.
      # See https://github.com/microsoft/playwright/issues/21990.
      WEBKIT_DISABLE_COMPOSITING_MODE: 1
      WEBKIT_DISABLE_DMABUF_RENDERER: 1
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - name: Run UI suites on Chromium, Firefox and WebKit
        run: >
          npx playwright test
          --project=chromium --project=firefox --project=webkit
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Upload blob report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 3
      - name: Upload failure artifacts (traces, videos, screenshots)
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7

  merge-reports:
    name: Merge sharded reports
    if: always()
    needs: ui-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download blob reports from all shards
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into a single HTML report
        run: node scripts/merge-reports.js all-blob-reports playwright-report
      - uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
